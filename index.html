<!doctype html><html dir="rtl" lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>המשימות שלי</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b0f14;color:#e8edf2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Heebo","Arial Hebrew",Arial,sans-serif;padding:14px 12px 30px;line-height:1.45}
.wrap{max-width:640px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;padding:2px 2px 8px}
h1{font-size:18px;font-weight:800}
.stamp{color:#7d8fa1;font-size:11px}
.live{font-size:10.5px;font-weight:700;color:#7cc4ff;border:1px solid #1d3a52;background:#0e1620;padding:2px 8px;border-radius:999px}
.chips{display:flex;gap:6px;margin:6px 0 10px;flex-wrap:wrap}
.chip{font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:999px;border:1px solid #2a3a4a;background:#141b24;color:#c7d2dd;cursor:pointer}
.chip.on{color:#7cc4ff;border-color:#1d3a52}
.pin{background:#171d12;border:1px solid #3a3416;border-right:4px solid #f0b429;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.pin .t{font-weight:800;font-size:14.5px}
.pin .n{font-size:12.5px;color:#d8c98a;margin-top:4px}
.pin .n b{color:#f0b429}
h2{font-size:11.5px;color:#8fa3b8;margin:12px 2px 5px;font-weight:700;letter-spacing:.3px}
.it{background:#121a23;border:1px solid #22303e;border-radius:10px;margin:5px 0}
.it summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 11px;cursor:pointer}
.it summary::-webkit-details-marker{display:none}
.it .nm{font-weight:700;font-size:13px}
.it .tm{color:#7d8fa1;font-size:11px;font-weight:400;margin-right:4px}
.bd{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;border:1px solid #2a3a4a;color:#c7d2dd}
.bd.g{color:#4cc38a;border-color:#1d3a2c}
.bd.a{color:#e0a63f;border-color:#4a3a12}
.bd.r{color:#e07a6a;border-color:#4a2620}
.more{padding:0 12px 9px;font-size:12px;color:#a9b8c6}
.more .act{color:#7cc4ff;font-weight:700}
.foot{margin-top:12px;font-size:10.5px;color:#5d7080;text-align:center}
a{color:#7cc4ff;text-decoration:none}
.inv{background:#0e141b;border:1px solid #22303e;border-radius:12px;margin-top:14px;padding:4px 10px 10px}
.inv>summary{cursor:pointer;list-style:none;font-weight:800;font-size:13.5px;padding:8px 2px}
.inv>summary::-webkit-details-marker{display:none}
.grp{margin:6px 0 2px;font-size:11.5px;color:#8fa3b8;font-weight:700}
.grp span{color:#5d7080;font-weight:400}
.inv ul{list-style:none}
.inv li{font-size:12px;color:#c7d2dd;padding:3px 2px 3px 10px;border-bottom:1px solid #16202b}
.inv li:last-child{border-bottom:none}
.auth{max-width:460px;margin:70px auto;padding:24px;background:#121a23;border:1px solid #22303e;border-radius:16px}.auth h1{font-size:26px}.auth p{margin:16px 0;font-size:16px}.auth button,#toolbar button{font:inherit;min-height:44px;padding:10px 18px;border-radius:8px;border:1px solid #43677e;background:#18354a;color:#e8edf2;cursor:pointer}#toolbar{max-width:640px;margin:0 auto 14px;text-align:end}.it summary{min-height:48px}.chip{min-height:44px;font-size:13px}.it .nm{font-size:15px}.more{font-size:14px}.stamp{font-size:12px}summary:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #7cc4ff;outline-offset:3px}body{overflow-wrap:anywhere} [hidden]{display:none!important}
</style></head><body><main id="login" class="auth"><h1>המשימות שלי</h1><p>כניסה לחשבון הגוגל המורשה כדי לצפות במשימות.</p><button id="signin" type="button">כניסה עם Google</button><p id="status" role="status"></p></main><div id="toolbar" hidden><button id="signout" type="button">יציאה</button></div><main id="dashboard" hidden></main><script type="module">import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut,browserSessionPersistence,setPersistence} from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js';
import {getDatabase,ref,get} from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js';
const firebaseConfig = {

  apiKey: "AIzaSyBumBEFjK5_mHgvw8nXSxafxELKTHaF-5I",

  authDomain: "amir-tasks-426a4.firebaseapp.com",

  databaseURL: "https://amir-tasks-426a4-default-rtdb.europe-west1.firebasedatabase.app",

  projectId: "amir-tasks-426a4",

  storageBucket: "amir-tasks-426a4.firebasestorage.app",

  messagingSenderId: "662894635571",

  appId: "1:662894635571:web:4a921d612ff279b2ecd146"

};

const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getDatabase(app);
const login=document.getElementById('login'), dash=document.getElementById('dashboard'), toolbar=document.getElementById('toolbar'), status=document.getElementById('status');
await setPersistence(auth,browserSessionPersistence);
document.getElementById('signin').onclick=async()=>{status.textContent='פותח כניסה מאובטחת…';try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){status.textContent='הכניסה לא הושלמה. אפשר לנסות שוב.';console.error(e.code)}};
document.getElementById('signout').onclick=()=>signOut(auth);
let request=0;
onAuthStateChanged(auth,async user=>{const current=++request;dash.replaceChildren();dash.hidden=true;toolbar.hidden=true;login.hidden=false;if(!user){status.textContent='';return;}status.textContent='בודק הרשאה וטוען את המשימות…';try{const snap=await get(ref(db,'dashboard'));if(!snap.exists())throw Error('empty');if(current!==request || auth.currentUser?.uid!==user.uid)return;const data=snap.val();dash.innerHTML=typeof data==='string'?data:data.html;dash.querySelectorAll('script,iframe,object,embed,form').forEach(x=>x.remove());dash.querySelectorAll('*').forEach(el=>[...el.attributes].forEach(a=>{if(a.name.startsWith('on'))el.removeAttribute(a.name)}));dash.querySelectorAll('a').forEach(a=>{if(!/^https:\/\//i.test(a.getAttribute('href')||''))a.removeAttribute('href');a.target='_blank';a.rel='noopener noreferrer'});dash.querySelectorAll('.chip').forEach(c=>{c.setAttribute('role','button');c.tabIndex=0;const act=()=>{dash.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');let f=c.dataset.f;dash.querySelectorAll('.it').forEach(it=>it.hidden=!(f==='all'||it.dataset.s===f));};c.onclick=act;c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act();}}});login.hidden=true;dash.hidden=false;toolbar.hidden=false;}catch(e){if(current!==request)return;await signOut(auth);status.textContent='לא ניתן לטעון את המשימות לחשבון הזה. יש להיכנס לחשבון המורשה.';console.error(e.code||e.message)}});
</script></body></html>
